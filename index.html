<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gallop &amp; Roll">
<meta name="theme-color" content="#7cc96b">
<title>Molly's Gallop &amp; Roll</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7cc96b;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
#wrap{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#c{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;background:rgba(255,248,230,.0);pointer-events:none}
.ov.on{pointer-events:auto}
.hide{display:none!important}
.title{font-size:8vmin;color:#fff;text-shadow:0 .6vmin 0 #d9433b,0 1.2vmin 1.5vmin rgba(0,0,0,.3);text-align:center;line-height:1}
.card{background:#fffaf0;border-radius:5vmin;padding:4vmin 5vmin;box-shadow:0 1.5vmin 0 #e6b84c,0 2vmin 4vmin rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;gap:3vmin}
.row{display:flex;gap:2.5vmin;flex-wrap:wrap;justify-content:center}
.pick{width:15vmin;height:15vmin;border-radius:50%;border:1vmin solid #fff;font-size:7vmin;font-weight:900;color:#fff;box-shadow:0 .8vmin 0 rgba(0,0,0,.25);opacity:.45;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.pick.sel{opacity:1;transform:scale(1.1);border-color:#ffd23f}
.big{min-width:30vmin;height:15vmin;border-radius:8vmin;border:none;background:#3cb44b;color:#fff;font-size:8vmin;font-weight:900;box-shadow:0 1.2vmin 0 #23802f;cursor:pointer;padding:0 5vmin}
.big:active{transform:translateY(.8vmin);box-shadow:0 .4vmin 0 #23802f}
.small{background:#5aa9e6;box-shadow:0 1.2vmin 0 #2d6fa3;font-size:6vmin}
.stars{font-size:6vmin;color:#f5a623;letter-spacing:.5vmin}
.lbl{font-size:4.5vmin;color:#7a5230;font-weight:800}
#music{pointer-events:auto;position:absolute;right:calc(env(safe-area-inset-right) + 2vmin + min(12vmin,64px));top:calc(env(safe-area-inset-top) + 2vmin);width:10vmin;height:10vmin;max-width:56px;max-height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:min(5.5vmin,30px);z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#music.off{opacity:.45;filter:grayscale(1)}
#music.off::after{content:'';position:absolute;left:18%;right:18%;top:48%;height:3px;background:#c33;transform:rotate(-40deg);border-radius:2px}
#mute{position:absolute;right:calc(env(safe-area-inset-right) + 2vmin);top:calc(env(safe-area-inset-top) + 2vmin);width:10vmin;height:10vmin;max-width:56px;max-height:56px;border-radius:50%;border:none;background:rgba(255,255,255,.85);font-size:5vmin;pointer-events:auto;z-index:5}
#home{position:absolute;left:calc(env(safe-area-inset-left) + 2vmin);top:calc(env(safe-area-inset-top) + 2vmin);width:10vmin;height:10vmin;max-width:56px;max-height:56px;border-radius:50%;border:none;background:rgba(255,255,255,.85);font-size:5vmin;z-index:5}
.tile{position:relative;width:min(19vmin,120px);height:min(16vmin,100px);border-radius:3vmin;border:.8vmin solid #fff;background:#e9f6ff;box-shadow:0 .8vmin 0 rgba(0,0,0,.2);padding:0;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.tile.sel{border-color:#ffc400;transform:scale(1.08);background:#fff4c2}
.tile.lock img{filter:grayscale(1) brightness(.9);opacity:.35}
.tile .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(10vmin,60px);font-weight:900;color:#fff;text-shadow:0 .5vmin 0 #7a8a99,0 0 1vmin rgba(0,0,0,.4)}
.tile.lock{background:#dfe3e6}
#picker .tile{width:min(10.5vmin,84px);height:min(10vmin,72px);border-radius:2vmin;border-width:.6vmin}#picker .tile .num{font-size:min(7vmin,44px)}#picker .tile.new{animation:pop 1s ease-out infinite alternate}#picker .row{gap:1vmin;flex-wrap:wrap;justify-content:center}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.12)}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas>
<button id="home" class="hide" aria-label="Home">🏠</button>
<button id="mute" aria-label="Sound">🔊</button><button id="music" aria-label="Music">🎵</button>
<div id="menu" class="ov on">
  <div class="title">Molly's<br>Gallop &amp; Roll</div>
  <div class="card">
    <div class="stars" id="stars"></div>
    <button class="big" id="play">▶ Play</button>
    <button class="big small hide" style="display:none" id="stablebtn" aria-label="Stable">🐴 <span id="cupcount">🏆0</span></button>
  </div>
</div>
<div id="stable" class="ov hide">
  <div class="card" style="max-width:92vw;max-height:88vh;overflow:auto">
    <div class="stars" id="stablecups"></div>
    <div class="row" id="ponies"></div>
    <div class="row" id="hats"></div>
    <button class="big" id="stabledone">✓</button>
  </div>
</div>
<div id="end" class="ov hide">
  <div style="flex:1"></div>
  <div id="picker" class="card hide" style="padding:2vmin 3vmin;max-width:96vw;gap:1.5vmin"><div class="row" id="endponies"></div><div class="row" id="endhats"></div></div>
  <div class="row" style="margin-bottom:6vmin">
    <button class="big" id="next">▶ Next race</button>
    <button class="big small" id="again">⟲</button>
  </div>
</div>
</div>
<script src="game.js?v=23"></script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){let r=!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!r){r=1;location.reload()}});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(g=>g.update()).catch(()=>{})}</script>
</body>
</html>
